<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>YummyPro Retail · Proveedores y Compras</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--bg2:#0c1b2f;--card:#0e1d30;--field:#071525;--item:#0a192a;--ghost:#16273b;--txt:#f6f8fb;--mut:#9fb0c5;--line:#203550;--a:#ffb703;--ok:#2dd4bf;--bad:#fb7185}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--txt);min-height:100vh}button,input,select,textarea{font:inherit}.hidden{display:none!important}.wrap{width:min(1180px,100%);margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.login{max-width:430px;margin:10vh auto}.mut{color:var(--mut)}label{display:block;margin:10px 0 6px;color:var(--mut);font-size:13px}input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px;outline:none}textarea{min-height:84px;resize:vertical}button{border:0;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:800}.primary{background:var(--a);color:#171000}.ghost{background:var(--ghost);color:var(--txt);border:1px solid var(--line)}.okbtn{background:#123b35;color:#ccfbf1;border:1px solid #1f7669}.full{width:100%;margin-top:16px}.top,.row,.between,.actions{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.row,.actions{flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;background:#13253a;color:var(--mut)}.tab.active{background:var(--a);color:#171000}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--item)}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#17304a;font-size:12px}.price{font-weight:900;color:var(--a)}.bad{color:var(--bad)}.ok{color:var(--ok)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search{flex:1 1 260px}.purchase-line{display:grid;grid-template-columns:minmax(0,1fr) 120px 135px auto;gap:8px;align-items:end}.summary{display:flex;justify-content:flex-end;gap:12px;align-items:center;font-size:20px;margin-top:12px}.modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:18px;background:#000b;z-index:5000;overflow:auto}.modal.open{display:flex}.modal .card{width:min(680px,100%);margin:3vh auto}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:7000;display:none;max-width:min(92vw,620px)}
@media(max-width:820px){.wrap{padding:12px}.top,.between{align-items:flex-start;flex-direction:column}.span4,.span5,.span6,.span7,.span8,.span12{grid-column:1/-1}.card{padding:15px}.purchase-line{grid-template-columns:1fr 1fr}.purchase-line .wide{grid-column:1/-1}.actions{width:100%}.actions button{flex:1 1 auto}}
</style>
</head>
<body>
<div id="login" class="wrap"><div class="card login"><h1 style="margin-top:0">Retail · Proveedores y Compras</h1><p class="mut">Gestión independiente para Minimarket / Tienda.</p><form id="loginForm"><label>Correo</label><input id="email" type="email" autocomplete="username" required><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button class="primary full" type="submit">Entrar</button><div id="loginMsg" class="mut" style="margin-top:12px"></div></form></div></div>
<main id="app" class="wrap hidden">
  <div class="top"><div><div class="mut">YUMMYPRO RETAIL</div><h1 id="businessName" style="margin:2px 0">Proveedores y compras</h1><div id="who" class="mut"></div></div><div class="actions"><select id="businessSelect" class="hidden" style="min-width:220px"></select><button class="ghost" id="refreshBtn">↻ Actualizar</button><button class="ghost" id="logoutBtn">Salir</button></div></div>
  <div class="tabs"><button class="tab active" data-view="suppliers">Proveedores</button><button class="tab" data-view="purchases">Compras</button></div>
  <section id="suppliers" class="section active">
    <div class="card"><div class="between"><div><h2 style="margin:0 0 5px">Proveedores</h2><p class="mut" style="margin:0">Alta, edición y estado de proveedores del negocio.</p></div><button class="primary" id="newSupplierBtn">＋ Proveedor</button></div><div class="toolbar"><input id="supplierSearch" class="search" placeholder="Buscar nombre, documento, teléfono o correo"></div><div id="supplierList" class="list"></div></div>
  </section>
  <section id="purchases" class="section">
    <div class="grid">
      <div class="card span7"><h2 style="margin-top:0">Recibir compra</h2><div class="grid"><div class="span6"><label>Proveedor</label><select id="purchaseSupplier"><option value="">Sin proveedor</option></select></div><div class="span6"><label>N.º documento</label><input id="documentNumber" placeholder="Factura / nota / referencia"></div><div class="span12"><label>Notas</label><textarea id="purchaseNotes" placeholder="Observaciones opcionales"></textarea></div></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>Agregar producto</h3><div class="purchase-line"><div class="wide"><label>Producto</label><select id="purchaseProduct"></select></div><div><label>Cantidad</label><input id="purchaseQty" type="number" min="0.001" step="1" value="1"></div><div><label>Costo unitario</label><input id="purchaseCost" type="number" min="0" step="0.01" value="0"></div><div><button class="ghost" id="addItemBtn">Agregar</button></div></div><div class="toolbar"><input id="purchaseCode" class="search" placeholder="O escribe/escanea código de barra o SKU"><button class="ghost" id="addCodeBtn">Agregar código</button></div><div id="purchaseCart" class="list"></div><div class="summary"><span>Total</span><strong id="purchaseTotal">$0</strong></div><button class="primary full" id="receivePurchaseBtn">Recibir compra y sumar stock</button><div id="purchaseMsg" class="mut" style="margin-top:10px"></div></div>
      <div class="card span5"><div class="between"><div><h2 style="margin:0 0 5px">Historial</h2><p class="mut" style="margin:0">Últimas compras recibidas.</p></div></div><div id="purchaseHistory" class="list" style="margin-top:12px"></div></div>
    </div>
  </section>
</main>
<div id="supplierModal" class="modal" aria-hidden="true"><div class="card"><div class="between"><div><div class="mut">PROVEEDOR</div><h2 id="supplierModalTitle" style="margin:2px 0">Nuevo proveedor</h2></div><button class="ghost" id="closeSupplierBtn">✕</button></div><input id="supplierId" type="hidden"><label>Nombre</label><input id="supplierName" required><div class="grid"><div class="span6"><label>Documento / RUT / NIT</label><input id="supplierTaxId"></div><div class="span6"><label>Teléfono</label><input id="supplierPhone"></div><div class="span6"><label>Correo</label><input id="supplierEmail" type="email"></div><div class="span6"><label>Dirección</label><input id="supplierAddress"></div><div class="span12"><label>Notas</label><textarea id="supplierNotes"></textarea></div></div><label class="row" style="margin-top:12px"><input id="supplierActive" type="checkbox" style="width:auto" checked> Activo</label><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="ghost" id="cancelSupplierBtn">Cancelar</button><button class="primary" id="saveSupplierBtn">Guardar proveedor</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const SB_URL='https://gulctljitzlwokqydigx.supabase.co';const SB_KEY='sb_publishable__moppTxObowifx6rJbW_tw_3GiCkqhG';const sb=supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let currentUser=null,currentRestaurant=null,currentConfig=null,currentRole=null,businesses=[],suppliers=[],products=[],purchases=[],cart=[];
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600)}
function money(v){const c=currentConfig?.currency_code||'CLP',l=currentConfig?.locale||'es-CL';try{return new Intl.NumberFormat(l,{style:'currency',currency:c}).format(Number(v||0))}catch{return c+' '+Number(v||0).toFixed(2)}}
async function resolveBusinesses(user){const {data:m,error}=await sb.from('restaurant_staff').select('restaurant_id,role,permissions').eq('user_id',user.id).eq('active',true);if(error)throw error;const ids=[...new Set((m||[]).map(x=>Number(x.restaurant_id)).filter(Boolean))];if(!ids.length)return[];const {data:r,error:re}=await sb.from('restaurants').select('id,name,business_type,currency_code,locale,timezone,active').in('id',ids);if(re)throw re;return(r||[]).filter(x=>['minimarket','supermarket'].includes(String(x.business_type||'').toLowerCase())).map(store=>({store,membership:(m||[]).find(v=>Number(v.restaurant_id)===Number(store.id))}))}
async function enter(user){currentUser=user;$('loginMsg').textContent='Verificando cuenta…';const {data:role,error}=await sb.rpc('current_account_role');if(error)throw error;if(role!=='restaurant'){await sb.auth.signOut();throw new Error('Esta cuenta no corresponde a un negocio Retail.')}businesses=await resolveBusinesses(user);if(!businesses.length){await sb.auth.signOut();throw new Error('Esta cuenta no tiene un Minimarket / Tienda asociado.')}const sel=$('businessSelect');sel.innerHTML=businesses.map(x=>`<option value="${x.store.id}">${esc(x.store.name||('Negocio #'+x.store.id))}</option>`).join('');sel.classList.toggle('hidden',businesses.length<2);sel.onchange=()=>selectBusiness(Number(sel.value));await selectBusiness(Number(sel.value||businesses[0].store.id));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('loginMsg').textContent='';applyRequestedView()}
async function selectBusiness(id){const hit=businesses.find(x=>Number(x.store.id)===Number(id));if(!hit)return;currentRestaurant=Number(hit.store.id);currentConfig=hit.store;currentRole=hit.membership?.role||'restaurant';$('businessName').textContent=hit.store.name||'Proveedores y compras';$('who').textContent='Rol: '+currentRole+' · '+(hit.store.business_type==='supermarket'?'Supermercado':'Minimarket / Tienda');cart=[];await refreshAll()}
async function refreshAll(){await Promise.allSettled([loadSuppliers(),loadProducts(),loadPurchases()]);syncSelectors();renderCart()}
async function loadSuppliers(){if(!currentRestaurant)return;const {data,error}=await sb.from('retail_suppliers').select('*').eq('restaurant_id',currentRestaurant).order('active',{ascending:false}).order('name');if(error)return toast(error.message);suppliers=data||[];renderSuppliers()}
function renderSuppliers(){const q=String($('supplierSearch').value||'').trim().toLowerCase();const rows=suppliers.filter(s=>!q||[s.name,s.tax_id,s.phone,s.email].some(v=>String(v||'').toLowerCase().includes(q)));$('supplierList').innerHTML=rows.map(s=>`<div class="item"><div class="between"><div><div class="row"><span class="pill">${s.active?'Activo':'Inactivo'}</span>${s.tax_id?`<span class="pill">${esc(s.tax_id)}</span>`:''}</div><h3 style="margin:8px 0 4px">${esc(s.name)}</h3><div class="mut">${esc([s.phone,s.email,s.address].filter(Boolean).join(' · '))}</div></div><div class="actions"><button class="ghost" onclick="editSupplier(${s.id})">Editar</button></div></div></div>`).join('')||'<div class="mut" style="padding:20px;text-align:center">No hay proveedores.</div>';syncSelectors()}
function openSupplier(){['supplierId','supplierName','supplierTaxId','supplierPhone','supplierEmail','supplierAddress','supplierNotes'].forEach(id=>$(id).value='');$('supplierActive').checked=true;$('supplierModalTitle').textContent='Nuevo proveedor';$('supplierModal').classList.add('open')}
function editSupplier(id){const s=suppliers.find(x=>Number(x.id)===Number(id));if(!s)return;$('supplierId').value=s.id;$('supplierName').value=s.name||'';$('supplierTaxId').value=s.tax_id||'';$('supplierPhone').value=s.phone||'';$('supplierEmail').value=s.email||'';$('supplierAddress').value=s.address||'';$('supplierNotes').value=s.notes||'';$('supplierActive').checked=!!s.active;$('supplierModalTitle').textContent='Editar proveedor';$('supplierModal').classList.add('open')}
function closeSupplier(){$('supplierModal').classList.remove('open')}
async function saveSupplier(){const id=Number($('supplierId').value)||null,row={restaurant_id:currentRestaurant,name:$('supplierName').value.trim(),tax_id:$('supplierTaxId').value.trim()||null,phone:$('supplierPhone').value.trim()||null,email:$('supplierEmail').value.trim()||null,address:$('supplierAddress').value.trim()||null,notes:$('supplierNotes').value.trim()||null,active:!!$('supplierActive').checked,updated_at:new Date().toISOString()};if(!row.name)return toast('Escribe el nombre del proveedor');const result=id?await sb.from('retail_suppliers').update(row).eq('id',id).eq('restaurant_id',currentRestaurant):await sb.from('retail_suppliers').insert(row);if(result.error)return toast(result.error.message);closeSupplier();await loadSuppliers();toast('Proveedor guardado')}
async function loadProducts(){if(!currentRestaurant)return;const {data,error}=await sb.from('retail_products').select('*').eq('restaurant_id',currentRestaurant).eq('active',true).order('name');if(error)return toast(error.message);products=data||[];syncSelectors()}
async function loadPurchases(){if(!currentRestaurant)return;const {data,error}=await sb.from('retail_purchases').select('*').eq('restaurant_id',currentRestaurant).order('created_at',{ascending:false}).limit(50);if(error)return toast(error.message);purchases=data||[];renderPurchases()}
function syncSelectors(){const ss=$('purchaseSupplier'),ps=$('purchaseProduct');if(ss){const v=ss.value;ss.innerHTML='<option value="">Sin proveedor</option>'+suppliers.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');ss.value=v}if(ps){const v=ps.value;ps.innerHTML=products.map(x=>`<option value="${x.id}">${esc(x.name)} · ${money(x.cost)} · stock ${Number(x.current_stock||0)}</option>`).join('');if(products.some(x=>String(x.id)===v))ps.value=v;syncProductCost()}}
function syncProductCost(){const p=products.find(x=>Number(x.id)===Number($('purchaseProduct').value));if(p&&!$('purchaseCost').dataset.edited)$('purchaseCost').value=Number(p.cost||0)}
function addSelectedProduct(){const p=products.find(x=>Number(x.id)===Number($('purchaseProduct').value));if(!p)return toast('Selecciona un producto');const qty=Number($('purchaseQty').value||0),cost=Number($('purchaseCost').value||0);if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(cost)||cost<0)return toast('Cantidad o costo inválido');if(!p.allow_fractional&&qty!==Math.trunc(qty))return toast('Ese producto no admite cantidades fraccionadas');const existing=cart.find(x=>Number(x.product_id)===Number(p.id));if(existing){existing.quantity=Number(existing.quantity)+qty;existing.unit_cost=cost}else cart.push({product_id:p.id,quantity:qty,unit_cost:cost});$('purchaseQty').value=1;$('purchaseCost').dataset.edited='';syncProductCost();renderCart()}
function addCode(){const code=String($('purchaseCode').value||'').trim().toLowerCase();if(!code)return;const p=products.find(x=>String(x.barcode||'').toLowerCase()===code||String(x.sku||'').toLowerCase()===code);if(!p)return toast('No encontré ese código o SKU');$('purchaseProduct').value=String(p.id);$('purchaseCost').dataset.edited='';syncProductCost();addSelectedProduct();$('purchaseCode').value=''}
function removeItem(i){cart.splice(i,1);renderCart()}
function renderCart(){let total=0;$('purchaseCart').innerHTML=cart.map((x,i)=>{const p=products.find(v=>Number(v.id)===Number(x.product_id)),line=Number(x.quantity)*Number(x.unit_cost);total+=line;return `<div class="item"><div class="between"><div><b>${esc(p?.name||'Producto')}</b><div class="mut">${Number(x.quantity).toLocaleString(currentConfig?.locale||'es-CL')} × ${money(x.unit_cost)}</div></div><div class="actions"><strong>${money(line)}</strong><button class="ghost" onclick="removeItem(${i})">✕</button></div></div></div>`}).join('')||'<div class="mut" style="padding:16px;text-align:center">Agrega productos a la compra.</div>';$('purchaseTotal').textContent=money(total)}
async function receivePurchase(){if(!cart.length)return toast('Agrega al menos un producto');const btn=$('receivePurchaseBtn');if(btn.dataset.busy==='1')return;btn.dataset.busy='1';btn.disabled=true;$('purchaseMsg').textContent='Registrando compra…';try{const {data,error}=await sb.rpc('retail_receive_purchase',{p_restaurant_id:currentRestaurant,p_supplier_id:Number($('purchaseSupplier').value)||null,p_document_number:$('documentNumber').value.trim()||null,p_notes:$('purchaseNotes').value.trim()||null,p_items:cart.map(x=>({product_id:x.product_id,quantity:Number(x.quantity),unit_cost:Number(x.unit_cost)}))});if(error)throw error;cart=[];$('documentNumber').value='';$('purchaseNotes').value='';$('purchaseSupplier').value='';await Promise.all([loadProducts(),loadPurchases()]);renderCart();$('purchaseMsg').textContent='Compra recibida correctamente'+(data?.purchase_id?' · #'+data.purchase_id:'');toast('Compra registrada y stock actualizado')}catch(e){$('purchaseMsg').textContent=e.message||'No se pudo registrar la compra';toast(e.message||'No se pudo registrar la compra')}finally{btn.dataset.busy='';btn.disabled=false}}
function renderPurchases(){$('purchaseHistory').innerHTML=purchases.map(x=>{const s=suppliers.find(v=>Number(v.id)===Number(x.supplier_id));return `<div class="item"><div class="between"><div><b>Compra #${x.id}</b><div class="mut">${new Date(x.created_at).toLocaleString(currentConfig?.locale||'es-CL')}${s?' · '+esc(s.name):''}${x.document_number?' · Doc. '+esc(x.document_number):''}</div></div><div><div class="price">${money(x.total)}</div><span class="pill">${esc(x.status||'received')}</span></div></div></div>`}).join('')||'<div class="mut" style="padding:20px;text-align:center">Todavía no hay compras registradas.</div>'}
function activateView(view){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===view))}
function applyRequestedView(){const params=new URLSearchParams(location.search),view=params.get('view');activateView(view==='purchases'?'purchases':'suppliers')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activateView(b.dataset.view));$('supplierSearch').addEventListener('input',renderSuppliers);$('newSupplierBtn').onclick=openSupplier;$('closeSupplierBtn').onclick=closeSupplier;$('cancelSupplierBtn').onclick=closeSupplier;$('saveSupplierBtn').onclick=saveSupplier;$('purchaseProduct').onchange=()=>{$('purchaseCost').dataset.edited='';syncProductCost()};$('purchaseCost').oninput=()=>{$('purchaseCost').dataset.edited='1'};$('addItemBtn').onclick=addSelectedProduct;$('addCodeBtn').onclick=addCode;$('purchaseCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCode()}});$('receivePurchaseBtn').onclick=receivePurchase;$('refreshBtn').onclick=refreshAll;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Ingresando…';try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!data?.user)throw new Error('No se pudo iniciar sesión');await enter(data.user)}catch(err){$('loginMsg').textContent=err.message||'No se pudo iniciar sesión'}});(async()=>{try{const {data:{session}}=await sb.auth.getSession();if(session?.user)await enter(session.user)}catch(err){$('loginMsg').textContent=err.message||'No se pudo recuperar la sesión'}})();
</script>
</body>
</html>
